name: Deploy Arcus Spot S3 archive

# Daily mirror of the Arcus Spot collector dumps (Python quote collector +
# Rust recorder, both on debot-arcus) to an isolated S3 prefix
# (bot-strategy#758). Manual dispatch only; the installed unit runs on its
# own daily timer once deployed.
#
# debot-arcus is a SEPARATE, SSM-only, no-inbound host from Frankfurt main
# (bot-strategy#758). This workflow never touches debot-pair-btceth and has
# no wallet/signing/submission capability -- it only mirrors already-public
# collector output to S3.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "dex-connector ref to deploy from (default: whatever was checked out)"
        required: false
        type: string

concurrency:
  group: arcus-archive-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ARCUS_S3_PREFIX: arcus-archive-deploy
  SCRIPT_S3_KEY: arcus-archive-deploy/archive-arcus-quotes.sh
  UNIT_S3_KEY: deploy/archive-arcus-quotes.service
  TIMER_S3_KEY: deploy/archive-arcus-quotes.timer
  BUILD_REGION: eu-central-1
  # bot-strategy#758: dedicated Frankfurt host, isolated from debot-pair-btceth.
  ARCUS_INSTANCE_ID: i-0cb942c2950be020f

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: sidecar
    steps:
      - name: Checkout dex-connector
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.BUILD_REGION }}

      - name: Upload to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
        run: |
          aws s3 cp deploy/archive-arcus-quotes.sh \
            "s3://${S3_BUCKET}/${SCRIPT_S3_KEY}"
          aws s3 cp deploy/archive-arcus-quotes.service \
            "s3://${S3_BUCKET}/${UNIT_S3_KEY}"
          aws s3 cp deploy/archive-arcus-quotes.timer \
            "s3://${S3_BUCKET}/${TIMER_S3_KEY}"

      # The timer is stopped and disabled before install so a rejected
      # redeploy can't leave a boot-time symlink pointing at an unverified
      # unit (Codex-flagged pattern, dex-connector#48/bot-strategy#768);
      # re-enabled only at the end, after the script has actually run once
      # and produced no error. The service is also explicitly stopped (not
      # just the timer) and restarted rather than started below: if a
      # manual dispatch overlaps the daily timer's own invocation,
      # `systemctl start` on an already-running oneshot only waits for or
      # joins that in-flight (old-script) run instead of exercising the
      # newly installed one (Codex P2 follow-up, dex-connector#50).
      - name: Deploy via SSM (install, verify, activate)
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
        run: |
          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "set -e",
              "sudo systemctl disable --now archive-arcus-quotes.timer 2>/dev/null || true",
              "sudo systemctl stop archive-arcus-quotes.service 2>/dev/null || true",
              "sudo mkdir -p /opt/arcus-archive/bin",
              "aws s3 cp s3://__S3_BUCKET__/__SCRIPT_S3_KEY__ /opt/arcus-archive/bin/archive-arcus-quotes.sh && sudo chmod 755 /opt/arcus-archive/bin/archive-arcus-quotes.sh",
              "aws s3 cp s3://__S3_BUCKET__/__UNIT_S3_KEY__ /tmp/archive-arcus-quotes.service",
              "if [ ! -f /etc/systemd/system/archive-arcus-quotes.service ] || ! cmp -s /etc/systemd/system/archive-arcus-quotes.service /tmp/archive-arcus-quotes.service; then sudo mv /tmp/archive-arcus-quotes.service /etc/systemd/system/archive-arcus-quotes.service; sudo systemctl daemon-reload; else rm /tmp/archive-arcus-quotes.service; fi",
              "aws s3 cp s3://__S3_BUCKET__/__TIMER_S3_KEY__ /tmp/archive-arcus-quotes.timer",
              "if [ ! -f /etc/systemd/system/archive-arcus-quotes.timer ] || ! cmp -s /etc/systemd/system/archive-arcus-quotes.timer /tmp/archive-arcus-quotes.timer; then sudo mv /tmp/archive-arcus-quotes.timer /etc/systemd/system/archive-arcus-quotes.timer; sudo systemctl daemon-reload; else rm /tmp/archive-arcus-quotes.timer; fi",
              "sudo systemctl restart archive-arcus-quotes.service",
              "result=$(systemctl show archive-arcus-quotes.service -p Result --value); if [ \"$result\" != \"success\" ]; then echo \"archive-arcus-quotes.service Result=$result\"; sudo journalctl -u archive-arcus-quotes.service -n 40 --no-pager; exit 1; fi",
              "sudo journalctl -u archive-arcus-quotes.service -n 20 --no-pager | grep -q 'sync complete' || { echo 'archive script did not report sync complete'; exit 1; }",
              "sudo systemctl enable --now archive-arcus-quotes.timer && systemctl list-timers archive-arcus-quotes.timer --no-pager | tail -3"
            ],
            "executionTimeout": ["3600"]
          }
          JSON
          sed -i "s|__S3_BUCKET__|${S3_BUCKET}|g; \
                  s|__SCRIPT_S3_KEY__|${SCRIPT_S3_KEY}|g; \
                  s|__UNIT_S3_KEY__|${UNIT_S3_KEY}|g; \
                  s|__TIMER_S3_KEY__|${TIMER_S3_KEY}|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${ARCUS_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Arcus Spot S3 archive (dex-connector)" \
            --parameters file:///tmp/ssm-params.json \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)

          # Sized to stay comfortably above executionTimeout (3600s, matching
          # the service's own TimeoutStartSec) plus delivery (300s) above --
          # aws s3 sync's upload time grows with the collectors'
          # ever-appending samples.jsonl files, so this isn't bounded by a
          # fixed retry count the way the recorder/collector workflows'
          # worst case is.
          set +e
          STATUS="Pending"
          for _ in $(seq 1 270); do
            STATUS=$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${ARCUS_INSTANCE_ID}" --query "Status" --output text 2>/dev/null)
            case "$STATUS" in
              Pending|InProgress|Delayed|"") sleep 15 ;;
              *) break ;;
            esac
          done
          case "$STATUS" in
            Pending|InProgress|Delayed|"")
              REFRESHED=$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${ARCUS_INSTANCE_ID}" --query "Status" --output text 2>/dev/null)
              [ -n "$REFRESHED" ] && STATUS="$REFRESHED"
              ;;
          esac
          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${ARCUS_INSTANCE_ID}" --output text
          [ "$STATUS" = "Success" ]
