name: Deploy RWA spot logger

# Phase 0 read-only collector for the Tier-1 RWA strategies (bot-strategy#574).
# Manual dispatch only. Models deploy-sidecar.yml: build an aarch64 binary in a
# QEMU arm64 AL2023 container, push to S3, then SSM-install on Frankfurt.
#
# Frankfurt is the sole remaining instance (Tokyo Arb terminated, #559). This is
# a SEPARATE observe-only unit — it does NOT restart debot-pair-btceth.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "dex-connector ref to build from (default: whatever was checked out)"
        required: false
        type: string

concurrency:
  group: rwa-logger-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AL2023_IMAGE: public.ecr.aws/amazonlinux/amazonlinux:2023
  RWA_S3_PREFIX: rwa-logger
  RWA_UNIT_S3_KEY: deploy/rwa-spot-logger.service
  APEX_UNIT_S3_KEY: deploy/apex-perp-logger.service
  BUILD_REGION: eu-central-1

jobs:
  build:
    runs-on: ubuntu-latest
    environment: sidecar
    steps:
      - name: Checkout dex-connector
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Cache cargo (linux/arm64)
        uses: actions/cache@v5
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/cargo/bin
            .cache/rustup
            target
          key: ${{ runner.os }}-cargo-arm64-rwa-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-arm64-rwa-

      - name: Build rwa-logger bins (linux/arm64, standalone crate)
        run: |
          mkdir -p .cache/cargo/registry .cache/cargo/git .cache/cargo/bin .cache/rustup target
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CARGO_HOME=/workspace/.cache/cargo \
            -e RUSTUP_HOME=/workspace/.cache/rustup \
            -e CARGO_INCREMENTAL=0 \
            ${AL2023_IMAGE} \
            /bin/bash -lc "set -euo pipefail; \
              dnf -y install gcc gcc-c++ make openssl-devel pkgconf-pkg-config git curl-minimal tar gzip; \
              if [ ! -x /workspace/.cache/cargo/bin/rustup ]; then \
                curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable; \
              fi; \
              export PATH=/workspace/.cache/cargo/bin:\$PATH; \
              rustc -V; cargo -V; \
              cargo build --release -p rwa-logger; \
              chown -R \${HOST_UID}:\${HOST_GID} /workspace/target /workspace/.cache/cargo /workspace/.cache/rustup"

      - name: Fix cache permissions
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" .cache/cargo .cache/rustup target
          fi

      - name: Sanity-check binaries
        run: |
          for b in rwa-spot-logger apex-perp-logger; do
            file "target/release/$b"
            # Expect ARM aarch64 ELF — guard against an accidental host-arch build.
            file "target/release/$b" | grep -q aarch64
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.BUILD_REGION }}

      - name: Upload to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
        run: |
          aws s3 cp target/release/rwa-spot-logger \
            "s3://${S3_BUCKET}/${RWA_S3_PREFIX}/rwa-spot-logger"
          aws s3 cp target/release/apex-perp-logger \
            "s3://${S3_BUCKET}/${RWA_S3_PREFIX}/apex-perp-logger"
          aws s3 cp deploy/rwa-spot-logger.service \
            "s3://${S3_BUCKET}/${RWA_UNIT_S3_KEY}"
          aws s3 cp deploy/apex-perp-logger.service \
            "s3://${S3_BUCKET}/${APEX_UNIT_S3_KEY}"
          aws s3 cp deploy/verify-logger.sh \
            "s3://${S3_BUCKET}/${RWA_S3_PREFIX}/verify-logger.sh"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: sidecar
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: frankfurt
            region: eu-central-1
            instance_id: i-0c08fba996bc21879
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      - name: Deploy via SSM (install, enable, start, verify) [${{ matrix.target }}]
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
          INSTANCE_ID: ${{ matrix.instance_id }}
        run: |
          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "sudo mkdir -p /opt/rwa-logger/bin /opt/debot-rwa",
              "aws s3 cp s3://__S3_BUCKET__/__RWA_S3_PREFIX__/rwa-spot-logger /opt/rwa-logger/bin/rwa-spot-logger && sudo chmod 755 /opt/rwa-logger/bin/rwa-spot-logger",
              "aws s3 cp s3://__S3_BUCKET__/__RWA_S3_PREFIX__/apex-perp-logger /opt/rwa-logger/bin/apex-perp-logger && sudo chmod 755 /opt/rwa-logger/bin/apex-perp-logger",
              "aws s3 cp s3://__S3_BUCKET__/__RWA_S3_PREFIX__/verify-logger.sh /tmp/verify-logger.sh && sudo chmod +x /tmp/verify-logger.sh",
              "aws s3 cp s3://__S3_BUCKET__/__RWA_UNIT_S3_KEY__ /tmp/rwa-spot-logger.service",
              "if [ ! -f /etc/systemd/system/rwa-spot-logger.service ] || ! cmp -s /etc/systemd/system/rwa-spot-logger.service /tmp/rwa-spot-logger.service; then sudo mv /tmp/rwa-spot-logger.service /etc/systemd/system/rwa-spot-logger.service; sudo systemctl daemon-reload; else rm /tmp/rwa-spot-logger.service; fi",
              "aws s3 cp s3://__S3_BUCKET__/__APEX_UNIT_S3_KEY__ /tmp/apex-perp-logger.service",
              "if [ ! -f /etc/systemd/system/apex-perp-logger.service ] || ! cmp -s /etc/systemd/system/apex-perp-logger.service /tmp/apex-perp-logger.service; then sudo mv /tmp/apex-perp-logger.service /etc/systemd/system/apex-perp-logger.service; sudo systemctl daemon-reload; else rm /tmp/apex-perp-logger.service; fi",
              "sudo systemctl enable rwa-spot-logger.service apex-perp-logger.service",
              "for u in rwa_spot:rwa-spot-logger apex_perp:apex-perp-logger; do p=${u%%:*}; f=/opt/debot-rwa/${p}_$(date -u +%Y%m%d).jsonl; { [ -f \"$f\" ] && wc -l < \"$f\" || echo 0; } > /tmp/${p}_baseline; done; echo \"baselines: spot=$(cat /tmp/rwa_spot_baseline) apex=$(cat /tmp/apex_perp_baseline)\"",
              "for u in rwa-spot-logger apex-perp-logger; do if systemctl is-active --quiet $u; then sudo systemctl restart $u; else sudo systemctl start $u; fi; done; echo '(re)started both loggers'",
              "sleep 3; for u in rwa-spot-logger apex-perp-logger; do systemctl is-active --quiet $u || { echo \"$u failed to start\"; sudo journalctl -u $u -n 30 --no-pager; exit 1; }; done",
              "sudo /tmp/verify-logger.sh rwa-spot-logger /opt/debot-rwa/rwa_spot_$(date -u +%Y%m%d).jsonl RWA_TOKENS usd_price /tmp/rwa_spot_baseline",
              "sudo /tmp/verify-logger.sh apex-perp-logger /opt/debot-rwa/apex_perp_$(date -u +%Y%m%d).jsonl APEX_SYMBOLS funding_rate /tmp/apex_perp_baseline"
            ]
          }
          JSON
          sed -i "s|__S3_BUCKET__|${S3_BUCKET}|g; \
                  s|__RWA_S3_PREFIX__|${RWA_S3_PREFIX}|g; \
                  s|__RWA_UNIT_S3_KEY__|${RWA_UNIT_S3_KEY}|g; \
                  s|__APEX_UNIT_S3_KEY__|${APEX_UNIT_S3_KEY}|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy rwa-spot-logger (dex-connector) [${{ matrix.target }}]" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          set +e
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
          WAIT_STATUS=$?
          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
          exit $WAIT_STATUS
